# PhoneBox Lite CI (this workflow file differs from upstream only on the Lite branch).
# No release, no installer tests and no build artifacts are published until reviewed.
name: PhoneBox Lite — compile and verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android 9 compatibility and APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Lint and compile Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug --no-daemon --console=plain

  agent:
    name: Agent unit tests and macOS ARM compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # Scope the first Lite build to the read-only boundary and passive system-monitor path.
      # The full upstream suite has 31 failing cases for deliberately removed integrations.
      # Keep those tests in the repository; do NOT represent this as a full-suite pass.
      - name: Lite boundary, network math and endpoint tests
        run: dotnet test agent/PhoneBox.Agent.Tests --nologo --filter "FullyQualifiedName~LiteSafetyTests|FullyQualifiedName~NetworkRatesTests|FullyQualifiedName~EndpointTests"
      - name: Build Mac Apple Silicon binary (cross compile, not run on Mac)
        run: |
          dotnet publish agent/PhoneBox.Agent -c Release -f net10.0 -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o out/osx-arm64 --nologo
          test -f out/osx-arm64/PhoneBoxAgent
      - name: Build Linux agent for isolated CI smoke test
        run: dotnet publish agent/PhoneBox.Agent -c Release -f net10.0 -r linux-x64 --self-contained false -o out/linux-x64 --nologo
      - name: Read-only API smoke test on temporary GitHub runner
        run: bash tools/lite-smoke.sh out/linux-x64/PhoneBoxAgent
